[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportyqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.16.0",
    "pytest>=9.1.1",
    "pytest-check>=2.9.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "selenium>=4.48.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "invoke>=2.2.0",
    "pre-commit>=4.4.0",
]

[tool.setuptools]
packages = ["sportyqa"]
